name: Fetch Stock Data

on:
  schedule:
    # 交易日 16:05 Asia/Shanghai (Monday-Friday)
    - cron: "5 8 * * 1-5"
  workflow_dispatch:
    inputs:
      full_sync:
        description: "全量同步（最近 2 年）"
        type: boolean
        default: false

jobs:
  fetch-stock-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run fetch script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.full_sync }}" = "true" ]; then
            ARGS="--full"
          fi
          npx tsx scripts/fetch-stock-data.ts $ARGS

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ 行情数据同步失败"
          echo "See: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
