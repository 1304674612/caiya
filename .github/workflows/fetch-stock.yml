name: Fetch Stock Data

on:
  schedule:
    # 交易日 16:05 Asia/Shanghai (Monday-Friday)
    - cron: "5 8 * * 1-5"
  workflow_dispatch:
    inputs:
      full_sync:
        description: "全量同步（最近 2 年）"
        type: boolean
        default: false
      intraday:
        description: "同步分钟数据"
        type: boolean
        default: false
      lookback:
        description: "回溯天数"
        type: number
        default: 30

jobs:
  fetch-stock-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run fetch script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
        run: |
          ARGS="--lookback ${{ github.event.inputs.lookback || 30 }}"
          if [ "${{ github.event.inputs.full_sync }}" = "true" ]; then
            ARGS="--full"
          fi
          if [ "${{ github.event.inputs.intraday }}" = "true" ]; then
            ARGS="$ARGS --intraday"
          fi
          python scripts/fetch_stock_data.py $ARGS

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-error-log
          path: scripts/fetch_stock_data.log

